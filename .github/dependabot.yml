# Daily updates; only signed patch/minor PRs passing affected CI may merge.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
      time: "03:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: deps
    groups:
      cargo-patch-and-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "03:30"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci
    groups:
      actions-patch-and-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /packaging/docker
    schedule:
      interval: daily
      time: "04:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: docker

  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: daily
      time: "04:30"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: deps(webui)
    groups:
      webui-patch-and-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: deps(docs)
    groups:
      docs-patch-and-minor:
        patterns: ["*"]
        update-types: [minor, patch]
