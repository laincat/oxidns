name: WebUI CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/*"
    paths:
      - ".github/**"
      - "webui/**"
      - ".github/workflows/webui-ci.yml"
  pull_request:
    branches:
      - main
      - "release/*"
    paths:
      - ".github/**"
      - "webui/**"
      - ".github/workflows/webui-ci.yml"

permissions:
  contents: read

jobs:
  webui:
    name: Lint, Test, Typecheck and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install WebUI dependencies
        working-directory: webui
        run: pnpm install --frozen-lockfile

      - name: Typecheck WebUI
        working-directory: webui
        run: pnpm typecheck

      - name: Lint WebUI
        working-directory: webui
        run: pnpm lint

      - name: Test WebUI
        working-directory: webui
        run: pnpm test

      - name: Build WebUI
        working-directory: webui
        run: pnpm build
